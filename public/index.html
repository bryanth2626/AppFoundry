<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizando PDF con Azure</title>
</head>
<body>
  <header>
    <h1>Lector de PDF</h1>
    <p>Sube un archivo PDF para analizarlo con Azure...</p>
  </header>

  <div>
    <form id="formulario">
      <input type="file" id="archivo" name="archivo" accept="application/pdf">
      <button type="submit">Extraer datos</button>
      <p id="estado"></p>
    </form>

    <!-- Resultado -->
    <div id="resultado"></div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
